version: '3.8'

services:
  blog-automation:
    build:
      context: .
      dockerfile: Dockerfile.blog
    container_name: blog-automation
    ports:
      - "8001:8000"  # 호스트의 8001 포트를 컨테이너의 8000 포트에 매핑
    environment:
      - DISPLAY=:99
      - PYTHONUNBUFFERED=1
    volumes:
      - ./static:/app/static
      - ./media:/app/media
      - ./logs:/app/logs
    shm_size: '2gb'  # 공유 메모리 크기 증가
    privileged: true  # Chrome 실행을 위한 권한
    restart: unless-stopped
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge 
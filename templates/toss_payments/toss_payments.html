<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- SDK 추가 -->
    <script src="https://js.tosspayments.com/v2/standard"></script>
  </head>
  <body>
    <!-- 사용자 정보 표시 -->
    <div style="margin: 20px; padding: 10px; border: 1px solid #ccc">
      <h3>사용자 정보</h3>
      <p><strong>이름:</strong> {{ user_name }}</p>
      <p><strong>이메일:</strong> {{ user_email }}</p>

      <!-- 디버깅 정보 -->
      <div style="margin-top: 10px; padding: 5px; background-color: #f0f0f0; font-size: 12px">
        <p>디버깅 정보:</p>
        <p>user_name 값: "{{ user_name }}"</p>
        <p>user_email 값: "{{ user_email }}"</p>
      </div>
    </div>

    <!-- 카드 등록하기 버튼 -->
    <button class="button" style="margin-top: 30px" onclick="requestBillingAuth()">카드 등록하기</button>
    <script>
      // ------  SDK 초기화 ------
      // @docs https://docs.tosspayments.com/sdk/v2/js#토스페이먼츠-초기화
      const clientKey = "{{ client_key }}";
      const customerKey = "{{ customer_key }}";
      const tossPayments = TossPayments(clientKey);
      // 회원 결제
      // @docs https://docs.tosspayments.com/sdk/v2/js#tosspaymentspayment
      const payment = tossPayments.payment({ customerKey });
      // 비회원 결제
      // const payment = tossPayments.payment({customerKey: TossPayments.ANONYMOUS})
      // ------ '카드 등록하기' 버튼 누르면 결제창 띄우기 ------
      // @docs https://docs.tosspayments.com/sdk/v2/js#paymentrequestpayment
      async function requestBillingAuth() {
        await payment.requestBillingAuth({
          method: "CARD", // 자동결제(빌링)는 카드만 지원합니다
          successUrl: window.location.origin + "/sales/toss-payments/success/", // 요청이 성공하면 리다이렉트되는 URL
          failUrl: window.location.origin + "/sales/toss-payments/fail/", // 요청이 실패하면 리다이렉트되는 URL
          customerEmail: "{{ user_email }}",
          customerName: "{{ user_name }}",
        });
      }
    </script>
  </body>
</html>

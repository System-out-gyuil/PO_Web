{% load static %}

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시판 - 자금왕</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Base CSS and Custom CSS -->
    <link rel="stylesheet" href="{% static 'diary/diary_board.css' %}" />
    <link rel="stylesheet" href="{% static 'diary/board/board.css' %}" />
    <link rel="stylesheet" href="{% static 'diary/base/base.css' %}" />
    <link rel="icon" href="{% static 'images/자금왕_favicon.png' %}" />

    <style>
      /* 삭제 버튼 스타일 */
      .announcement-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .edit-btn {
        background: none;
        border: none;
        color: #3b82f6;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        transition: all 0.2s;
        font-size: 14px;
      }

      .edit-btn:hover {
        background-color: #eff6ff;
        color: #2563eb;
      }

      .delete-btn {
        background: none;
        border: none;
        color: #ef4444;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        transition: all 0.2s;
        font-size: 14px;
      }

      .delete-btn:hover {
        background-color: #fef2f2;
        color: #dc2626;
      }

      /* 삭제 모달 스타일 */
      .btn-delete {
        background-color: #ef4444;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .btn-delete:hover {
        background-color: #dc2626;
      }

      .text-red-500 {
        color: #ef4444;
      }

      .text-sm {
        font-size: 0.875rem;
      }

      .mt-2 {
        margin-top: 0.5rem;
      }

      @media (max-width: 768px) {
        .search-input-container {
          width: 96%;
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    {% include 'diary/header.html' %}

    <!-- Main Content -->
    <main class="container">
      <div class="board-container">
        <!-- 헤더 -->
        <div class="board-header">
          <h1><i class="fas fa-clipboard-list"></i> 게시판</h1>
        </div>

        <!-- 게시판 탭 -->
        <div class="tab-content active" id="board-tab">
          <!-- 카테고리 탭 -->
          <div class="category-tabs" id="category-tabs">
            <div class="loading">
              <div class="spinner"></div>
            </div>
          </div>

          <!-- 검색 및 필터 -->
          <div class="search-controls">
            <div class="search-box" style="max-width: 420px; width: 100%">
              <div class="search-input-container">
                <input
                  type="text"
                  id="board-search"
                  placeholder="게시글 검색..."
                  onkeyup="searchBoards()"
                  class="search-input bg-white border border-gray-200 rounded-full pl-5 pr-12 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 transition w-full text-gray-800 placeholder-gray-400"
                />
                <button
                  onclick="searchBoards()"
                  type="button"
                  style="
                    position: absolute;
                    right: 8px;
                    top: 50%;
                    transform: translateY(-50%);
                    background: #667eea;
                    border: none;
                    border-radius: 50%;
                    width: 38px;
                    height: 38px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 2px 8px rgba(102, 126, 234, 0.08);
                  "
                  class="hover:bg-indigo-700 transition"
                >
                  <i class="fas fa-search" style="color: white; font-size: 1.1rem"></i>
                </button>
              </div>
            </div>
            {% if is_authenticated %}
            <div class="button-group" id="user-buttons">
              <button class="add-category-button" onclick="showAddCategoryModal()" style="margin-right: 10px">
                <i class="fas fa-plus"></i> 새 카테고리
              </button>
              <button class="write-button" onclick="showWriteBoardModal()"><i class="fas fa-pen"></i> 게시글 작성</button>
            </div>
            {% endif %}
          </div>

          <!-- 게시글 목록 -->
          <div class="announcement-list" id="board-list">
            <div class="loading">
              <div class="spinner"></div>
            </div>
          </div>

          <!-- 페이지네이션 -->
          <div class="pagination" id="board-pagination" style="display: none"></div>
        </div>

        <!-- 모달 -->
        <div class="modal" id="writeBoardModal" style="display: none">
          <div class="modal-content">
            <div class="modal-header">
              <h3>게시글 작성</h3>
              <button class="close" onclick="closeWriteBoardModal()">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label class="form-label">카테고리</label>
                <select id="board-category-input" class="form-input">
                  <option value="">카테고리 선택</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">제목</label>
                <input type="text" id="board-title-input" class="form-input" placeholder="제목을 입력하세요" />
              </div>
              <div class="form-group">
                <label class="form-label">내용</label>
                <textarea id="board-content-input" class="form-textarea" placeholder="내용을 입력하세요"></textarea>
              </div>
              <div class="file-upload-section">
                <div class="file-upload-area" onclick="document.getElementById('board-file-input').click()">
                  <div class="file-upload-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                  </div>
                  <div class="file-upload-text">파일을 드래그하거나 클릭하여 업로드하세요</div>
                </div>
                <input type="file" id="board-file-input" class="file-input" multiple />
                <div class="file-list" id="boardFileList"></div>
                <div class="upload-progress" id="boardUploadProgress" style="display: none">
                  <div class="progress-bar">
                    <div class="progress-fill" id="boardProgressBar"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn-submit" onclick="submitBoard()">작성</button>
              <button class="btn-cancel" onclick="closeWriteBoardModal()">취소</button>
            </div>
          </div>
        </div>

        <!-- 새 카테고리 추가 모달 -->
        <div class="modal" id="addCategoryModal" style="display: none">
          <div class="modal-content">
            <div class="modal-header">
              <h3>새 카테고리 추가</h3>
              <button class="close" onclick="closeAddCategoryModal()">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label class="form-label">카테고리명</label>
                <input type="text" id="new-category-input" class="form-input" placeholder="새 카테고리명을 입력하세요" maxlength="20" />
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn-submit" onclick="submitNewCategory()">추가</button>
              <button class="btn-cancel" onclick="closeAddCategoryModal()">취소</button>
            </div>
          </div>
        </div>

        <!-- 게시글 삭제 확인 모달 -->
        <div class="modal" id="deleteBoardModal" style="display: none">
          <div class="modal-content">
            <div class="modal-header">
              <h3>게시글 삭제</h3>
              <button class="close" onclick="closeDeleteBoardModal()">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="modal-body">
              <p>정말로 "<span id="delete-board-title"></span>" 게시글을 삭제하시겠습니까?</p>
              <p class="text-red-500 text-sm mt-2">이 작업은 되돌릴 수 없습니다.</p>
            </div>
            <div class="modal-footer">
              <button class="btn-delete" onclick="confirmDeleteBoard()">삭제</button>
              <button class="btn-cancel" onclick="closeDeleteBoardModal()">취소</button>
            </div>
          </div>
        </div>

        <!-- 게시글 수정 모달 -->
        <div class="modal" id="editBoardModal" style="display: none">
          <div class="modal-content">
            <div class="modal-header">
              <h3>게시글 수정</h3>
              <button class="close" onclick="closeEditBoardModal()">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label class="form-label">제목</label>
                <input type="text" id="edit-board-title-input" class="form-input" placeholder="제목을 입력하세요" />
              </div>
              <div class="form-group">
                <label class="form-label">카테고리</label>
                <select id="edit-board-category-input" class="form-input">
                  <option value="">카테고리 선택</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">내용</label>
                <textarea id="edit-board-content-input" class="form-textarea" placeholder="내용을 입력하세요"></textarea>
              </div>
              <div class="file-upload-section">
                <div class="file-upload-area" onclick="document.getElementById('edit-board-file-input').click()">
                  <div class="file-upload-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                  </div>
                  <div class="file-upload-text">파일을 드래그하거나 클릭하여 업로드하세요</div>
                </div>
                <input type="file" id="edit-board-file-input" class="file-input" multiple />
                <div class="file-list" id="editBoardFileList"></div>
                <div class="upload-progress" id="editBoardUploadProgress" style="display: none">
                  <div class="progress-bar">
                    <div class="progress-fill" id="editBoardProgressBar"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn-submit" onclick="submitBoardEdit()">수정</button>
              <button class="btn-cancel" onclick="closeEditBoardModal()">취소</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      let currentCategoryId = null; // 현재 선택된 카테고리 ID
      let currentCategoryName = "일반"; // 현재 선택된 카테고리명

      // 카테고리 탭 로드
      async function loadCategories() {
        try {
          const response = await fetch("/sales/board/categories/");
          const data = await response.json();

          if (data.success) {
            renderCategoryTabs(data.categories);

            // 카테고리가 로드된 후 첫 번째 카테고리 자동 선택
            if (data.categories.length > 0 && !currentCategoryId) {
              const firstCategory = data.categories[0];
              selectCategory(firstCategory.id, firstCategory.name);
            }
          } else {
            showError("카테고리를 불러오는데 실패했습니다: " + data.message);
          }
        } catch (error) {
          console.error("Error loading categories:", error);
          showError("카테고리를 불러오는데 실패했습니다.");
        }
      }

      // 카테고리 탭 렌더링
      function renderCategoryTabs(categories) {
        const categoryTabs = document.getElementById("category-tabs");

        if (!categoryTabs) return;

        let html = "";
        categories.forEach((category, index) => {
          // 첫 번째 카테고리이거나 현재 선택된 카테고리인 경우 활성화
          const activeClass = (index === 0 && !currentCategoryId) || category.id === currentCategoryId ? "active" : "";
          html += `
                    <button class="category-tab ${activeClass}" onclick="selectCategory(${category.id}, '${escapeHtml(category.name)}')">
                        ${escapeHtml(category.name)}
                    </button>
                `;
        });

        categoryTabs.innerHTML = html;

        // 디버깅용 로그
        console.log(`카테고리 탭 렌더링 완료: ${categories.length}개, 현재 선택: ${currentCategoryId}`);
      }

      // 카테고리 선택
      function selectCategory(categoryId, categoryName) {
        currentCategoryId = categoryId;
        currentCategoryName = categoryName;

        // 탭 활성화 상태 업데이트
        const tabs = document.querySelectorAll(".category-tab");
        tabs.forEach((tab) => {
          // onclick 속성에서 categoryId를 추출하여 비교
          const tabCategoryId = tab.onclick.toString().match(/selectCategory\((\d+)/)?.[1];
          if (tabCategoryId && parseInt(tabCategoryId) === categoryId) {
            tab.classList.add("active");
          } else {
            tab.classList.remove("active");
          }
        });

        // 카테고리 변경 시 1페이지부터 시작
        loadBoards(1, "", categoryId);

        // 디버깅용 로그
        console.log(`카테고리 선택됨: ID=${categoryId}, 이름=${categoryName}`);
      }

      // 게시글 검색
      function searchBoards() {
        const searchInput = document.getElementById("board-search");
        const searchTerm = searchInput ? searchInput.value.trim() : "";

        // 검색 시 1페이지부터 시작
        loadBoards(1, searchTerm, currentCategoryId);
      }

      // 게시글 목록 로드
      async function loadBoards(page = 1, search = "", categoryId = null) {
        try {
          const params = new URLSearchParams({
            page: page,
            search: search,
          });

          if (categoryId) {
            params.append("category", categoryId);
          }

          const response = await fetch(`/sales/board/api/?${params}`);
          const data = await response.json();

          if (data.success) {
            renderBoards(data.boards);
            renderPagination(data.pagination);
          } else {
            showError("게시글을 불러오는데 실패했습니다: " + data.message);
          }
        } catch (error) {
          console.error("Error loading boards:", error);
          showError("게시글을 불러오는데 실패했습니다.");
        }
      }

      // 게시글 목록 렌더링
      function renderBoards(boards) {
        const boardList = document.getElementById("board-list");

        if (!boardList) return;

        if (boards.length === 0) {
          boardList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <h5>게시글이 없습니다</h5>
                        <p>첫 번째 게시글을 작성해보세요.</p>
                    </div>
                `;
          return;
        }

        let html = "";
        boards.forEach((board) => {
          const createdDate = new Date(board.created_at).toLocaleDateString("ko-KR");
          const contentPreview = board.content.length > 300 ? board.content.substring(0, 300) + "..." : board.content;

          html += `
                    <div class="announcement-item">
                        <div class="announcement-header">
                            <h3 class="announcement-title" onclick="viewBoardDetail(${board.id})">${escapeHtml(board.title)}</h3>
                            <div class="announcement-actions">
                                <button class="edit-btn" onclick="editBoard(${board.id})" title="수정">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="delete-btn" onclick="deleteBoard(${board.id}, '${escapeHtml(board.title)}')" title="삭제">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="announcement-meta">
                            <span class="announcement-author">
                                <i class="fas fa-user"></i> ${escapeHtml(board.author_name)}
                            </span>
                            <span class="announcement-date">
                                <i class="fas fa-calendar-alt"></i> ${createdDate}
                            </span>
                            <span class="announcement-category">
                                <i class="fas fa-tag"></i> ${escapeHtml(board.category_name || "일반")}
                            </span>
                        </div>
                        <div class="announcement-content" onclick="viewBoardDetail(${board.id})">
                            <p>${escapeHtml(contentPreview)}</p>
                        </div>
                        ${
                          board.files && board.files.length > 0
                            ? `
                            <div class="announcement-files" onclick="viewBoardDetail(${board.id})">
                                <i class="fas fa-paperclip"></i> 첨부파일 ${board.files.length}개
                            </div>
                        `
                            : ""
                        }
                    </div>
                `;
        });

        boardList.innerHTML = html;
      }

      // 페이지네이션 렌더링
      function renderPagination(pagination) {
        const paginationContainer = document.getElementById("board-pagination");

        if (!paginationContainer) return;

        if (pagination.num_pages <= 1) {
          paginationContainer.innerHTML = "";
          paginationContainer.style.display = "none";
          return;
        }

        paginationContainer.style.display = "flex";

        let html = "";

        // 페이지 정보 표시

        // 이전 페이지
        if (pagination.has_previous) {
          html += `<a href="#" class="page-button" onclick="loadBoards(${pagination.previous_page_number}, '', currentCategoryId)">
                    <i class="fas fa-chevron-left"></i>
                </a>`;
        }

        // 페이지 번호
        const startPage = Math.max(1, pagination.number - 2);
        const endPage = Math.min(pagination.num_pages, pagination.number + 2);

        for (let i = startPage; i <= endPage; i++) {
          const activeClass = i === pagination.number ? "active" : "";
          html += `<a href="#" class="page-button ${activeClass}" onclick="loadBoards(${i}, '', currentCategoryId)">${i}</a>`;
        }

        // 다음 페이지
        if (pagination.has_next) {
          html += `<a href="#" class="page-button" onclick="loadBoards(${pagination.next_page_number}, '', currentCategoryId)">
                    <i class="fas fa-chevron-right"></i>
                </a>`;
        }

        paginationContainer.innerHTML = html;
      }

      // 게시글 상세보기
      function viewBoardDetail(boardId) {
        window.location.href = `/sales/board/${boardId}/`;
      }

      // 에러 표시
      function showError(message) {
        const boardList = document.getElementById("board-list");
        if (boardList) {
          boardList.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        ${escapeHtml(message)}
                    </div>
                `;
        }
      }

      // HTML 이스케이프 함수
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // 게시글 작성 모달 표시
      function showWriteBoardModal() {
        const modal = document.getElementById("writeBoardModal");
        modal.style.display = "block";

        // 폼 초기화
        document.getElementById("board-title-input").value = "";
        document.getElementById("board-content-input").value = "";
        document.getElementById("boardFileList").innerHTML = "";
        document.getElementById("boardUploadProgress").style.display = "none";

        // 카테고리 옵션 로드
        loadBoardCategoryOptions();

        // 제목 입력 필드에 포커스
        document.getElementById("board-title-input").focus();

        // 파일 입력 이벤트 리스너 추가
        setupFileUpload();
      }

      // 게시글 작성 모달용 카테고리 옵션 로드
      async function loadBoardCategoryOptions() {
        try {
          const response = await fetch("/sales/board/categories/");
          const data = await response.json();

          if (data.success) {
            const categorySelect = document.getElementById("board-category-input");
            if (categorySelect) {
              // 기존 옵션들 제거 (첫 번째 "카테고리 선택" 옵션 제외)
              while (categorySelect.children.length > 1) {
                categorySelect.removeChild(categorySelect.lastChild);
              }

              // 새 카테고리 옵션들 추가
              data.categories.forEach((category) => {
                const option = document.createElement("option");
                option.value = category.id;
                option.textContent = category.name;
                // 현재 선택된 카테고리인 경우 선택
                if (category.id === currentCategoryId) {
                  option.selected = true;
                }
                categorySelect.appendChild(option);
              });
            }
          }
        } catch (error) {
          console.error("카테고리 옵션 로드 오류:", error);
        }
      }

      // 게시글 작성 모달 닫기
      function closeWriteBoardModal() {
        const modal = document.getElementById("writeBoardModal");
        modal.style.display = "none";
      }

      // 파일 업로드 설정
      function setupFileUpload() {
        const fileInput = document.getElementById("board-file-input");
        const fileList = document.getElementById("boardFileList");

        // 파일 선택 이벤트
        fileInput.addEventListener("change", handleFileSelect);

        // 드래그 앤 드롭 이벤트
        const uploadSection = document.querySelector(".file-upload-section");

        uploadSection.addEventListener("dragover", (e) => {
          e.preventDefault();
          uploadSection.style.borderColor = "#667eea";
        });

        uploadSection.addEventListener("dragleave", (e) => {
          e.preventDefault();
          uploadSection.style.borderColor = "#dee2e6";
        });

        uploadSection.addEventListener("drop", (e) => {
          e.preventDefault();
          uploadSection.style.borderColor = "#dee2e6";

          const files = e.dataTransfer.files;
          handleFiles(files);
        });
      }

      // 파일 선택 처리
      function handleFileSelect(event) {
        const files = event.target.files;
        handleFiles(files);
      }

      // 파일 처리
      function handleFiles(files) {
        const fileList = document.getElementById("boardFileList");

        Array.from(files).forEach((file) => {

      // 파일 아이콘 반환
      function getFileIcon(fileName) {
        const fileExt = fileName.split(".").pop()?.toLowerCase() || "";

        const iconMap = {
          // 이미지 파일
          jpg: "🖼️",
          jpeg: "🖼️",
          png: "🖼️",
          gif: "🖼️",

          csv: "📊",

          pptx: "📋",

          rar: "📦",

          mp3: "🎵",
          wav: "🎵",
          flac: "🎵",
          aac: "🎵",
          ogg: "🎵",
          // 비디오 파일

          md: "📄",
        };

        return iconMap[fileExt] || "📄";
      }

      // 파일 크기 포맷팅
      function formatFileSize(bytes) {
        if (bytes === 0) return "0 Bytes";

        const k = 1024;
        const sizes = ["Bytes", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));

        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
      }

          if (fileItems.length > 0) {

                const progress = ((i + 1) / fileItems.length) * 100;

      // 수정 모달용 카테고리 옵션 로드
      async function loadEditCategoryOptions(selectedCategoryId) {
        try {
          const response = await fetch("/sales/board/categories/");
          const data = await response.json();

          if (data.success) {
            const categorySelect = document.getElementById("edit-board-category-input");
            if (categorySelect) {
              // 기존 옵션들 제거 (첫 번째 "카테고리 선택" 옵션 제외)
              while (categorySelect.children.length > 1) {
                categorySelect.removeChild(categorySelect.lastChild);
              }

              // 새 카테고리 옵션들 추가
              data.categories.forEach((category) => {
                const option = document.createElement("option");
                option.value = category.id;
                option.textContent = category.name;
                // 현재 게시글의 카테고리이거나 현재 선택된 카테고리인 경우 선택
                if (category.id === selectedCategoryId || category.id === currentCategoryId) {
                  option.selected = true;
                }
                categorySelect.appendChild(option);
              });

              // 선택된 카테고리가 없으면 현재 선택된 카테고리로 설정
              if (!selectedCategoryId && currentCategoryId) {
                categorySelect.value = currentCategoryId;
              }
            }
          }
        } catch (error) {
          console.error("카테고리 옵션 로드 오류:", error);
        }
      }

      // 수정 모달용 파일 업로드 설정
      function setupEditFileUpload() {
        const fileInput = document.getElementById("edit-board-file-input");
        const fileList = document.getElementById("editBoardFileList");

        // 파일 선택 이벤트
        fileInput.addEventListener("change", handleEditFileSelect);

        // 드래그 앤 드롭 이벤트
        const uploadSection = document.querySelector("#editBoardModal .file-upload-section");

        uploadSection.addEventListener("dragover", (e) => {
          e.preventDefault();
          uploadSection.style.borderColor = "#667eea";
        });

        uploadSection.addEventListener("dragleave", (e) => {
          e.preventDefault();
          uploadSection.style.borderColor = "#dee2e6";
        });

        uploadSection.addEventListener("drop", (e) => {
          e.preventDefault();
          uploadSection.style.borderColor = "#dee2e6";

          const files = e.dataTransfer.files;
          handleEditFiles(files);
        });
      }

        const files = event.target.files;

      function handleEditFiles(files) {
        const fileList = document.getElementById("editBoardFileList");

        Array.from(files).forEach((file) => {

          if (file.size > 200 * 1024 * 1024) {
            alert(`파일 크기가 너무 큽니다: ${file.name}`);

          const fileItem = createEditFileItem(file);
          fileList.appendChild(fileItem);
        });

      function removeEditFile(button) {

      // 기존 파일 목록 렌더링
      function renderExistingFilesForEdit(files) {
        const fileList = document.getElementById("editBoardFileList");

        if (!files || files.length === 0) {
          return;
        }

        files.forEach((file, index) => {
          const fileIcon = getFileIcon(file.original_name);
          const fileSize = formatFileSize(file.file_size);

          const fileItem = document.createElement("div");
          fileItem.className = "file-item existing-file";
          fileItem.dataset.fileIndex = index;
          fileItem.style.backgroundColor = "#f0f9ff";
          fileItem.style.border = "1px solid #3b82f6";

          fileItem.innerHTML = `
                    <div class="file-info">
                        <div class="file-icon">
                            ${fileIcon}
                        </div>
                        <div>
                            <div class="file-name">${escapeHtml(file.original_name)}</div>
                            <div class="file-size">${fileSize} <span style="color: #3b82f6; font-size: 0.75rem;">(기존 파일)</span></div>
                        </div>
                    </div>
                    <button class="file-remove" onclick="removeExistingEditFile(${index})">
                        <i class="fas fa-times"></i>
                    </button>
                `;

          fileList.appendChild(fileItem);
        });
      }

      // 기존 파일 제거
      function removeExistingEditFile(index) {
        if (confirm("이 파일을 삭제하시겠습니까?")) {
          // 전역 변수에서 해당 파일 제거
          if (window.currentEditFiles && window.currentEditFiles[index]) {
            window.currentEditFiles.splice(index, 1);
          }

          // DOM에서 해당 파일 아이템 제거
          const fileItems = document.querySelectorAll("#editBoardFileList .existing-file");
          fileItems.forEach((item) => {
            if (parseInt(item.dataset.fileIndex) === index) {
              item.remove();
            }
          });

          // 파일 목록 다시 렌더링 (인덱스 재정렬)
          document.querySelectorAll("#editBoardFileList .file-item").forEach((item) => item.remove());
          renderExistingFilesForEdit(window.currentEditFiles || []);
        }
      }

            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCookie("csrftoken"),
            },
            body: JSON.stringify({
              title: title,
              content: content,
              category: categoryId || null, // 'category'로 전송 (백엔드에서 둘 다 받음)
              files: finalFiles,
            }),
          });

          const data = await response.json();
          console.log("서버 응답:", data);

          if (data.success) {
            alert("게시글이 수정되었습니다.");
            closeEditBoardModal();
            // 게시글 목록 새로고침
            loadBoards(1, "", currentCategoryId);
          } else {
            alert("게시글 수정에 실패했습니다: " + data.message);
          }
        } catch (error) {
          console.error("Error editing board:", error);
          alert("게시글 수정 중 오류가 발생했습니다.");
        } finally {
          // 제출 버튼 다시 활성화
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
          document.getElementById("editBoardUploadProgress").style.display = "none";
        }
      }

      // CSRF 토큰 가져오기
      function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
          const cookies = document.cookie.split(";");
          for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === name + "=") {
              cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
              break;
            }
          }
        }
        return cookieValue;
      }

      // 로그아웃 함수
      function logout() {
        if (confirm("로그아웃하시겠습니까?")) {
          // 서버에 로그아웃 요청
          fetch("/sales/logout/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCookie("csrftoken"),
            },
          })
            .then((response) => {
              // 로그아웃은 항상 성공으로 처리 (리다이렉트 응답이므로)
              console.log("로그아웃 응답:", response.status);

              // 브라우저 캐시 정리
              if ("caches" in window) {
                caches.keys().then(function (names) {
                  for (let name of names) {
                    caches.delete(name);
                  }
                });
              }

              // 세션 스토리지 정리
              sessionStorage.clear();

              // 로그인 페이지로 리다이렉트
              window.location.href = "/sales/login/";
            })
            .catch((error) => {
              console.error("로그아웃 오류:", error);
              // 오류가 발생해도 로그인 페이지로 이동
              window.location.href = "/sales/login/";
            });
        }
      }

      // 모달 외부 클릭 시 닫기
      window.onclick = function (event) {
        const writeModal = document.getElementById("writeBoardModal");
        const categoryModal = document.getElementById("addCategoryModal");
        const deleteModal = document.getElementById("deleteBoardModal");
        const editModal = document.getElementById("editBoardModal");

        if (event.target === writeModal) {
          closeWriteBoardModal();
        }
        if (event.target === categoryModal) {
          closeAddCategoryModal();
        }
        if (event.target === deleteModal) {
          closeDeleteBoardModal();
        }
        if (event.target === editModal) {
          closeEditBoardModal();
        }
      };

      // Enter 키로 제출
      document.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && event.ctrlKey) {
          event.preventDefault();
          submitBoard();
        }

        // 새 카테고리 모달에서 Enter 키로 제출
        if (event.key === "Enter" && document.getElementById("addCategoryModal").style.display === "block") {
          event.preventDefault();
          submitNewCategory();
        }

        // 수정 모달에서 Enter 키로 제출
        if (event.key === "Enter" && document.getElementById("editBoardModal").style.display === "block") {
          event.preventDefault();
          submitBoardEdit();
        }
      });

      // 페이지 로드 시 초기 데이터 로드
      document.addEventListener("DOMContentLoaded", function () {
        loadCategories(); // 카테고리 먼저 로드
        // 첫 번째 카테고리 선택 (기본값)
        // 이 부분은 loadCategories 함수 내부에서 처리되므로 제거
      });
    </script>

    <!-- Base JavaScript -->
    <script src="{% static 'diary/base/base.js' %}"></script>
  </body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지 게시판 - 자금왕</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Base CSS and Custom CSS -->
    <link rel="stylesheet" href="{% static 'diary/diary_board.css' %}">
    <link rel="stylesheet" href="{% static 'diary/base/base.css' %}">
    <link rel="icon" href="{% static 'images/자금왕_favicon.png' %}">
    
    <style>
        /* 카테고리 탭 스타일 */
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
            padding: 10px;
        }
        

        .category-tab {
            padding: 8px 16px;
            border: none;
            background: #f3f4f6;
            color: #6b7280;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .category-tab:hover {
            background: #e5e7eb;
            color: #374151;
        }

        .category-tab.active {
            background: #667eea;
            color: white;
        }

        /* 카테고리 관리 버튼 */
        .category-manage-button {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .category-manage-button:hover {
            background: #5a6268;
        }

        /* 카테고리 관리 모달 스타일 */
        .category-item {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .category-item:last-child {
            margin-bottom: 0;
        }
        
        /* 카테고리 배지 스타일 */
        .category-badge {
            background: #667eea !important;
            color: white !important;
            padding: 2px 8px !important;
            border-radius: 12px !important;
            font-size: 12px !important;
            margin-left: 10px !important;
            display: inline-block !important;
            vertical-align: middle !important;
        }
        
        /* 카테고리 표시 스타일 */
        .category-display {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .category-note {
            color: #6b7280;
            font-size: 12px;
            font-style: italic;
        }
        
        /* 카테고리가 없을 때 메시지 스타일 */
        .no-category-message {
            text-align: center;
            padding: 20px;
            color: #6b7280;
            font-size: 14px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin: 10px 0;
        }
        
        .no-category-message p {
            margin: 0;
            line-height: 1.5;
        }
        
        /* 유효성 검사 스타일 */
        .form-input.error,
        .form-textarea.error,
        .form-input.error:focus,
        .form-textarea.error:focus {
            border-color: #dc3545 !important;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25) !important;
        }
        
        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .form-group.error .form-label {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <!-- Header -->
    {% include 'diary/header.html' %}

    <!-- Main Content -->
    <main class="container">
        <div class="board-container">
            <!-- 헤더 -->
            <div class="board-header">
                <h1><i class="fas fa-bullhorn"></i> 공지 게시판</h1>
                <p class="text-muted">공고사항을 확인하세요</p>
            </div>

            <!-- 공고 게시판 탭 -->
            <div class="tab-content active" id="announcement-tab">
                <!-- 카테고리 탭 -->
                <div class="category-tabs" id="announcement-category-tabs">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
                
                <!-- 검색 및 필터 -->
                <div class="search-controls">
                    <div class="search-box" style="max-width: 420px; width: 100%;">
                        <div style="position: relative; width: 100%;">
                            <input type="text" id="announcement-search" placeholder="공고 검색..." onkeyup="searchAnnouncements()"
                                class="search-input bg-white border border-gray-200 rounded-full pl-5 pr-12 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 transition w-full text-gray-800 placeholder-gray-400" />
                            <button onclick="searchAnnouncements()" type="button"
                                style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: #667eea; border: none; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(102,126,234,0.08);"
                                class="hover:bg-indigo-700 transition">
                                <i class="fas fa-search" style="color: white; font-size: 1.1rem;"></i>
                            </button>
                        </div>
                    </div>
                    {% if is_authenticated and is_admin %}
                    <div class="button-group" id="admin-buttons">
                        <button class="write-button" onclick="showWriteAnnouncementModal()">
                            <i class="fas fa-pen"></i> 공고 작성
                        </button>
                        <button class="category-manage-button" onclick="showCategoryManageModal()">
                            <i class="fas fa-tags"></i> 카테고리 관리
                        </button>
                    </div>
                    {% endif %}
                </div>
                
                <!-- 공고 목록 -->
                <div class="announcement-list" id="announcement-list">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
                
                <!-- 페이지네이션 -->
                <div class="pagination" id="announcement-pagination" style="display: none;">
                </div>
            </div>

            <!-- 모달 -->
            <div class="modal" id="writeAnnouncementModal" style="display: none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>공고 작성</h3>
                        <button class="close" onclick="closeWriteAnnouncementModal()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label class="form-label">제목</label>
                            <input type="text" id="announcement-title-input" class="form-input" placeholder="제목을 입력하세요">
                            <div class="error-message" id="title-error">제목을 입력해주세요</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">카테고리</label>
                            <select id="announcement-category-input" class="form-input">
                                <option value="">카테고리 선택 (선택사항)</option>
                                <!-- 카테고리 옵션들은 JavaScript로 동적 생성 -->
                            </select>
                            <div class="error-message" id="category-error">카테고리를 선택해주세요</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">내용</label>
                            <textarea id="announcement-content-input" class="form-textarea" placeholder="내용을 입력하세요"></textarea>
                            <div class="error-message" id="content-error">내용을 입력해주세요</div>
                        </div>
                        <div class="file-upload-section">
                            <div class="file-upload-area" onclick="document.getElementById('announcement-file-input').click()">
                                <div class="file-upload-icon">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                </div>
                                <div class="file-upload-text">
                                    파일을 드래그하거나 클릭하여 업로드하세요
                                </div>
                            </div>
                            <input type="file" id="announcement-file-input" class="file-input" multiple>
                            <div class="file-list" id="announcementFileList"></div>
                            <div class="upload-progress" id="announcementUploadProgress" style="display: none;">
                                <div class="progress-bar">
                                    <div class="progress-fill" id="announcementProgressBar"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-cancel" onclick="closeWriteAnnouncementModal()">취소</button>
                        <button class="btn-submit" onclick="submitAnnouncement()">작성</button>
                    </div>
                </div>
            </div>

            <!-- 카테고리 관리 모달 -->
            <div class="modal" id="categoryManageModal" style="display: none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>카테고리 관리</h3>
                        <button class="close" onclick="closeCategoryManageModal()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label class="form-label">새 카테고리 추가</label>
                            <div style="display: flex; gap: 10px;">
                                <input type="text" id="new-category-name" class="form-input" placeholder="카테고리명을 입력하세요" style="flex: 1;">
                                <button onclick="addAnnouncementCategory()" class="btn-submit" style="white-space: nowrap;">추가</button>
                            </div>
                        </div>
                        <div class="category-list" id="announcement-category-list">
                            <!-- 카테고리 목록은 JavaScript로 동적 생성 -->
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-cancel" onclick="closeCategoryManageModal()">닫기</button>
                    </div>
                </div>
            </div>

            <!-- 게시글 편집 모달 -->
            <div class="modal" id="editAnnouncementModal" style="display: none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>게시글 편집</h3>
                        <button class="close" onclick="closeEditAnnouncementModal()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label class="form-label">제목</label>
                            <input type="text" id="edit-announcement-title" class="form-input" placeholder="제목을 입력하세요">
                            <div class="error-message" id="edit-title-error">제목을 입력해주세요</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">카테고리</label>
                            <select id="edit-announcement-category" class="form-input">
                                <option value="">카테고리 선택</option>
                                <!-- 카테고리 옵션들은 JavaScript로 동적 생성 -->
                            </select>
                            <div class="error-message" id="edit-category-error">카테고리를 선택해주세요</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">내용</label>
                            <textarea id="edit-announcement-content" class="form-textarea" placeholder="내용을 입력하세요"></textarea>
                            <div class="error-message" id="edit-content-error">내용을 입력해주세요</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">파일 관리</label>
                            <div class="file-upload-section">
                                <div class="file-upload-area" onclick="document.getElementById('edit-announcement-file-input').click()">
                                    <div class="file-upload-icon">
                                        <i class="fas fa-cloud-upload-alt"></i>
                                    </div>
                                    <div class="file-upload-text">
                                        파일을 드래그하거나 클릭하여 업로드하세요
                                    </div>
                                </div>
                                <input type="file" id="edit-announcement-file-input" class="file-input" multiple>
                                <div class="file-list" id="editAnnouncementFileList"></div>
                                <div class="upload-progress" id="editAnnouncementUploadProgress" style="display: none;">
                                    <div class="progress-bar">
                                        <div class="progress-fill" id="editAnnouncementProgressBar"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-cancel" onclick="closeEditAnnouncementModal()">취소</button>
                        <button class="btn-submit" onclick="updateAnnouncement()">수정</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Custom JS -->
    <script src="{% static 'diary/diary_board.js' %}"></script>
    <script src="{% static 'diary/base/base.js' %}"></script>
    <script>
        let currentCategoryId = null;  // 현재 선택된 카테고리 ID
        let currentCategoryName = '일반';  // 현재 선택된 카테고리명
        let is_admin = false;  // 기본값 설정
        
        // Django 템플릿 변수를 JavaScript 변수로 설정
        {% if is_admin %}
        is_admin = true;
        {% endif %}
        
        // 탭 전환
        function switchTab(tabName) {
            // 모든 탭 버튼 비활성화
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 모든 탭 콘텐츠 숨기기
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // 선택된 탭 활성화
            if (tabName === 'announcement') {
                document.querySelector('#announcement-tab').classList.add('active');
                document.querySelector('.tab-button:first-child').classList.add('active');
                loadAnnouncements();
            }
        }
        
        // 페이지네이션 렌더링 함수 수정
        function renderPagination(pagination) {
            const paginationContainer = document.getElementById('announcement-pagination');
            
            if (!paginationContainer) return;
            
            if (pagination.num_pages <= 1) {
                paginationContainer.innerHTML = '';
                paginationContainer.style.display = 'none';
                return;
            }
            
            paginationContainer.style.display = 'flex';
            
            let html = '';
            
            // 페이지 정보 표시
            
            
            // 이전 페이지
            if (pagination.has_previous) {
                html += `<a href="#" class="page-button" onclick="loadAnnouncements(${pagination.previous_page_number}, '', currentCategoryId)">
                    <i class="fas fa-chevron-left"></i>
                </a>`;
            }
            
            // 페이지 번호
            const startPage = Math.max(1, pagination.number - 2);
            const endPage = Math.min(pagination.num_pages, pagination.number + 2);
            
            for (let i = startPage; i <= endPage; i++) {
                const activeClass = i === pagination.number ? 'active' : '';
                html += `<a href="#" class="page-button ${activeClass}" onclick="loadAnnouncements(${i}, '', currentCategoryId)">${i}</a>`;
            }
            
            // 다음 페이지
            if (pagination.has_next) {
                html += `<a href="#" class="page-button" onclick="loadAnnouncements(${pagination.next_page_number}, '', currentCategoryId)">
                    <i class="fas fa-chevron-right"></i>
                </a>`;
            }
            
            paginationContainer.innerHTML = html;
        }
        
        // 공고 상세보기를 새 페이지로 이동
        function viewAnnouncementDetail(announcementId) {
            window.location.href = `/sales/diary_board/announcement/${announcementId}/detail/`;
        }
        
        // 공고 카테고리 관련 함수들
        
        // 공고 카테고리 탭 전환
        function switchAnnouncementCategory(categoryId, categoryName) {
            console.log('switchAnnouncementCategory 호출됨:', { categoryId, categoryName });
            
            // 현재 선택된 카테고리 정보 업데이트
            currentCategoryId = categoryId;
            currentCategoryName = categoryName || '전체';
            
            // 모든 카테고리 탭에서 active 클래스 제거
            const tabs = document.querySelectorAll('#announcement-category-tabs .category-tab');
            tabs.forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 클릭된 탭에 active 클래스 추가
            const clickedTab = Array.from(tabs).find(tab => {
                if (categoryId === null) {
                    return tab.textContent.trim() === '전체';
                } else {
                    const tabCategoryId = tab.onclick.toString().match(/switchAnnouncementCategory\('(\d+)'/)?.[1];
                    return tabCategoryId && parseInt(tabCategoryId) === parseInt(categoryId);
                }
            });
            
            if (clickedTab) {
                clickedTab.classList.add('active');
                console.log('카테고리 탭 활성화:', clickedTab.textContent.trim());
            }
            
            // 카테고리 변경 시 1페이지부터 시작
            loadAnnouncements(1, '', categoryId);
            
            // 디버깅용 로그
            console.log(`카테고리 선택됨: ID=${categoryId}, 이름=${categoryName}`);
        }
        
        // 공고 카테고리 탭 렌더링
        function renderAnnouncementCategoryTabs(categories) {
            console.log('renderAnnouncementCategoryTabs 호출됨, categories:', categories);
            const tabsContainer = document.getElementById('announcement-category-tabs');
            console.log('tabsContainer:', tabsContainer);
            
            if (!tabsContainer) {
                console.error('announcement-category-tabs 요소를 찾을 수 없음');
                return;
            }
            
            console.log('카테고리 탭 HTML 생성 시작...');
            let html = '';
            
            // "전체" 탭을 맨 앞에 추가
            const allActiveClass = !currentCategoryId ? 'active' : '';
            html += `
                <button class="category-tab ${allActiveClass}" onclick="switchAnnouncementCategory(null, '전체')">
                    전체
                </button>
            `;
            
            // 기존 카테고리들 추가
            if (categories && categories.length > 0) {
                categories.forEach((category, index) => {
                    console.log(`카테고리 ${index}:`, category);
                    const activeClass = category.id == currentCategoryId ? 'active' : '';
                    html += `
                        <button class="category-tab ${activeClass}" onclick="switchAnnouncementCategory('${category.id}', '${escapeHtml(category.category_name)}')">
                            ${escapeHtml(category.category_name)}
                        </button>
                    `;
                });
            }
            
            console.log('생성된 HTML:', html);
            tabsContainer.innerHTML = html;
            
            // 디버깅용 로그
            console.log(`카테고리 탭 렌더링 완료: ${categories ? categories.length : 0}개, 현재 선택: ${currentCategoryId}`);
        }
        
        // 공고 카테고리 목록 렌더링
        function renderAnnouncementCategoryList(categories) {
            const categoryList = document.getElementById('announcement-category-list');
            if (!categoryList) return;
            
            if (categories.length === 0) {
                categoryList.innerHTML = '<p style="text-align: center; color: #666;">등록된 카테고리가 없습니다.</p>';
                return;
            }
            
            let html = '';
            categories.forEach(category => {
                html += `
                    <div class="category-item" style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px;">
                        <span>${escapeHtml(category.category_name)}</span>
                        <button onclick="deleteAnnouncementCategory(${category.id})" 
                                style="background: #dc3545; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px;">
                            삭제
                        </button>
                    </div>
                `;
            });
            
            categoryList.innerHTML = html;
        }
        
        // 공고 카테고리 추가
        async function addAnnouncementCategory() {
            const categoryName = document.getElementById('new-category-name').value.trim();
            
            if (!categoryName) {
                alert('카테고리명을 입력해주세요.');
                return;
            }
            
            try {
                const response = await fetch('/sales/diary_board/announcement/category/create/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        category_name: categoryName
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('카테고리가 추가되었습니다.');
                    document.getElementById('new-category-name').value = '';
                    loadAnnouncementCategories();
                    loadAnnouncementCategoriesForTabs();
                } else {
                    alert('카테고리 추가에 실패했습니다: ' + data.message);
                }
            } catch (error) {
                console.error('카테고리 추가 오류:', error);
                alert('카테고리 추가 중 오류가 발생했습니다.');
            }
        }
        
        // 공고 카테고리 삭제
        async function deleteAnnouncementCategory(categoryId) {
            if (!confirm('이 카테고리를 삭제하시겠습니까? 해당 카테고리의 공고들은 카테고리가 없는 상태로 유지됩니다.')) {
                return;
            }
            
            try {
                const response = await fetch(`/sales/diary_board/announcement/category/${categoryId}/delete/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('카테고리가 삭제되었습니다.');
                    loadAnnouncementCategories();
                    loadAnnouncementCategoriesForTabs();

            try {

        // 공고 목록 로드 함수 (카테고리 지원)
        async function loadAnnouncements(page = 1, search = '', categoryId = null) {
            try {
                const params = new URLSearchParams({
                    page: page,
                    search: search
                });
                
                // 카테고리 ID가 있는 경우에만 파라미터 추가
                if (categoryId) {
                    params.append('category', categoryId);
                }
                
                const response = await fetch(`/sales/diary_board/announcement/?${params}`);
                const data = await response.json();
                
                if (data.success) {
                    renderAnnouncements(data.announcements);
                    renderPagination(data.pagination);
                } else {
                    showError('공고를 불러오는데 실패했습니다: ' + data.message);
                }
            } catch (error) {
                console.error('Error loading announcements:', error);
                showError('공고를 불러오는데 실패했습니다.');
            }
        }

        // 공고 목록 렌더링 (카테고리 정보 포함)
        function renderAnnouncements(announcements) {
            const announcementList = document.getElementById('announcement-list');
            
            if (!announcementList) return;
            
            if (!announcements || announcements.length === 0) {
                announcementList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-bullhorn"></i>
                        <h5>공고가 없습니다</h5>
                        <p>첫 번째 공고를 작성해보세요.</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            announcements.forEach(announcement => {
                const createdDate = new Date(announcement.created_at).toLocaleDateString('ko-KR');
                
                // 본문 내용 추출 (다양한 데이터 구조 지원)
                let contentText = '';
                if (announcement.content) {
                    if (typeof announcement.content === 'string') {
                        contentText = announcement.content;
                    } else if (announcement.content.text) {
                        contentText = announcement.content.text;
                    } else if (announcement.content.content) {
                        contentText = announcement.content.content;
                    }
                }
                
                // 본문 미리보기 (300자 제한)
                const contentPreview = contentText && contentText.length > 300 ? 
                    contentText.substring(0, 300) + '...' : contentText;
                
                const categoryName = announcement.category_name || '일반';
                const categoryBadge = announcement.category ? 
                    `<span class="category-badge">${escapeHtml(categoryName)}</span>` : '';
                
                html += `
                    <div class="announcement-item" onclick="viewAnnouncementDetail(${announcement.id})">
                        <div class="announcement-header">
                            <h3 class="announcement-title">
                                ${escapeHtml(announcement.title)}
                                ${categoryBadge}
                            </h3>
                            <div class="announcement-meta">
                                <span class="announcement-author">
                                    <i class="fas fa-user"></i> ${escapeHtml(announcement.author_name || '관리자')}
                                </span>
                                <span class="announcement-date">
                                    <i class="fas fa-calendar-alt"></i> ${createdDate}
                                </span>
                            </div>
                        </div>
                        <div class="announcement-content">
                            <p>${escapeHtml(contentPreview)}</p>
                        </div>
                        <div class="announcement-controler">

                            <div class="announcement-files">
                                <i class="fas fa-paperclip"></i> 첨부파일 ${announcement.files.length}개
                            </div>
                        ` : '<div></div>'}
                        ${typeof is_admin !== 'undefined' && is_admin ? `
                            <div class="announcement-actions" onclick="event.stopPropagation();">
                                <button class="btn-edit" data-id="${announcement.id}" data-title="${announcement.title}" data-content="${contentPreview}" data-category="${announcement.category_id || announcement.category || ''}" data-files="${announcement.files ? JSON.stringify(announcement.files).replace(/"/g, '&quot;') : ''}">
                                    <i class="fas fa-edit"></i> 편집
                                </button>
                                <button class="btn-delete" data-id="${announcement.id}">
                                    <i class="fas fa-trash"></i> 삭제
                                </button>
                            </div>
                        ` : ''}
                        </div>
                    </div>
                `;
            });
            
            announcementList.innerHTML = html;
            
            // 편집/삭제 버튼에 이벤트 리스너 추가
            if (typeof is_admin !== 'undefined' && is_admin) {
                setupAnnouncementActions();
            }

        // 공고 액션 버튼 이벤트 리스너 설정
        function setupAnnouncementActions() {
            // 편집 버튼 이벤트 리스너
            document.querySelectorAll('.btn-edit').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.getAttribute('data-id');
                    const title = this.getAttribute('data-title');
                    const content = this.getAttribute('data-content');
                    const category = this.getAttribute('data-category');
                    const filesData = this.getAttribute('data-files');
                    
                    let files = [];
                    if (filesData) {
                        try {
                            files = JSON.parse(filesData);
                        } catch (e) {
                            console.error('파일 데이터 파싱 오류:', e);
                            files = [];
                        }
                    }
                    
                    showEditAnnouncementModal(id, title, content, category, files);
                });
            });
            
            // 삭제 버튼 이벤트 리스너
            document.querySelectorAll('.btn-delete').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.getAttribute('data-id');
                    deleteAnnouncement(id);
                });
            });

        // 일반 게시판 페이지네이션 렌더링
        function renderGeneralPagination(pagination) {
            const paginationContainer = document.getElementById('general-pagination');
            
            if (!paginationContainer) return;
            
            if (pagination.num_pages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }
            
            let html = '';
            
            // 이전 페이지
            if (pagination.has_previous) {
                html += `<a href="#" class="page-button" onclick="loadGeneralBoards(${pagination.previous_page_number})">
                    <i class="fas fa-chevron-left"></i>
                </a>`;
            }
            
            // 페이지 번호
            const startPage = Math.max(1, pagination.number - 2);
            const endPage = Math.min(pagination.num_pages, pagination.number + 2);
            
            for (let i = startPage; i <= endPage; i++) {
                const activeClass = i === pagination.number ? 'active' : '';
                html += `<a href="#" class="page-button ${activeClass}" onclick="loadGeneralBoards(${i})">${i}</a>`;
            }
            
            // 다음 페이지
            if (pagination.has_next) {
                html += `<a href="#" class="page-button" onclick="loadGeneralBoards(${pagination.next_page_number})">
                    <i class="fas fa-chevron-right"></i>
                </a>`;
            }
            
            paginationContainer.innerHTML = html;
        }

        // HTML 이스케이프 함수
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 이모지 안전 처리 함수
        function safeEmojiText(text) {
            if (!text) return '';
            // 이모지가 제대로 표시되도록 안전하게 처리
            return text.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(match) {
                return match;
            });
        }

        // 실시간 유효성 검사
        function setupRealTimeValidation() {
            const titleInput = document.getElementById('announcement-title-input');
            const contentInput = document.getElementById('announcement-content-input');
            const categoryInput = document.getElementById('announcement-category-input');
            
            // 제목 입력 시 실시간 검사
            if (titleInput) {
                titleInput.addEventListener('input', function() {
                    if (this.value.trim()) {
                        clearFieldError('announcement-title-input', 'title-error');
                    }
                });
            }
            
            // 내용 입력 시 실시간 검사
            if (contentInput) {
                contentInput.addEventListener('input', function() {
                    if (this.value.trim()) {
                        clearFieldError('announcement-content-input', 'content-error');
                    }
                });
            }
            
            // 카테고리 선택 시 실시간 검사 (필수)
            if (categoryInput) {
                categoryInput.addEventListener('change', function() {
                    if (this.value.trim()) {
                        clearFieldError('announcement-category-input', 'category-error');
                    }
                });
            }
        }
        
        // 파일 업로드 설정
        function setupFileUpload() {
            const fileInput = document.getElementById('board-file-input');
            const fileList = document.getElementById('fileList');
            
            // 파일 선택 이벤트
            fileInput.addEventListener('change', handleFileSelect);
            
            // 드래그 앤 드롭 이벤트
            const uploadSection = document.querySelector('.file-upload-section');
            
            uploadSection.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadSection.style.borderColor = '#667eea';
            });
            
            uploadSection.addEventListener('dragleave', (e) => {
                e.preventDefault();
                uploadSection.style.borderColor = '#dee2e6';
            });
            
            uploadSection.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadSection.style.borderColor = '#dee2e6';
                
                const files = e.dataTransfer.files;
                handleFiles(files);
            });
        }
        
        // 파일 선택 처리
        function handleFileSelect(event) {
            const files = event.target.files;
            handleFiles(files);
        }
        
        // 파일 처리
        function handleFiles(files) {
            const fileList = document.getElementById('fileList');
            
            Array.from(files).forEach(file => {
                // 파일 크기 제한 (10MB)
                if (file.size > 10 * 1024 * 1024) {
                    alert(`파일 크기가 너무 큽니다: ${file.name}`);
                    return;
                }
                
                // 파일 아이템 생성
                const fileItem = createFileItem(file);
                fileList.appendChild(fileItem);
            });
        }
        
        // 파일 아이템 생성
        function createFileItem(file) {
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.dataset.fileName = file.name;
            fileItem.dataset.fileSize = file.size;
            
            const fileIcon = getFileIcon(file.name);
            const fileSize = formatFileSize(file.size);
            
            fileItem.innerHTML = `
                <div class="file-info">
                    <div class="file-icon">
                        <i class="${fileIcon}"></i>
                    </div>
                    <div>
                        <div class="file-name">${escapeHtml(file.name)}</div>
                        <div class="file-size">${fileSize}</div>
                    </div>
                </div>
                <button class="file-remove" onclick="removeFile(this)">
                    <i class="fas fa-times"></i>
                </button>
            `;

        // 게시글 작성 제출
        async function submitBoard() {
            const title = document.getElementById('board-title-input').value.trim();
            const content = document.getElementById('board-content-input').value.trim();
            
            // 유효성 검사
            if (!title) {
                alert('제목을 입력해주세요.');
                document.getElementById('board-title-input').focus();
                return;
            }
            
            if (!content) {
                alert('내용을 입력해주세요.');
                document.getElementById('board-content-input').focus();
                return;
            }
            
            // 제출 버튼 비활성화
            const submitBtn = document.querySelector('.btn-submit');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = '작성 중...';
            
            try {
                // 파일 업로드 처리
                const fileItems = document.querySelectorAll('#fileList .file-item');
                let uploadedFiles = [];
                
                if (fileItems.length > 0) {
                    // 업로드 진행률 표시
                    document.getElementById('uploadProgress').style.display = 'block';
                    const progressBar = document.getElementById('progressBar');
                    
                    for (let i = 0; i < fileItems.length; i++) {
                        const fileItem = fileItems[i];
                        const fileName = fileItem.dataset.fileName;
                        const fileSize = fileItem.dataset.fileSize;
                        
                        // 파일 객체 찾기
                        const fileInput = document.getElementById('board-file-input');
                        const file = Array.from(fileInput.files).find(f => f.name === fileName);
                        
                        if (file) {
                            // 진행률 업데이트
                            const progress = ((i + 1) / fileItems.length) * 100;
                            progressBar.style.width = progress + '%';
                            
                            // 파일 업로드
                            const formData = new FormData();
                            formData.append('file', file);
                            
                            const uploadResponse = await fetch('/sales/diary_board/general/upload-file/', {
                                method: 'POST',
                                headers: {
                                    'X-CSRFToken': getCookie('csrftoken')
                                },
                                body: formData
                            });
                            
                            const uploadData = await uploadResponse.json();
                            
                            if (uploadData.success) {
                                uploadedFiles.push(uploadData.file);
                            } else {
                                alert(`파일 업로드 실패: ${fileName}`);
                            }
                        }
                    }
                }
                
                // 게시글 작성
                const response = await fetch('/sales/diary_board/general/create/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        title: title,
                        content: content,
                        files: uploadedFiles
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('게시글이 작성되었습니다.');
                    closeWriteBoardModal();
                    // 게시글 목록 새로고침
                    loadGeneralBoards();
                } else {
                    alert('게시글 작성에 실패했습니다: ' + data.message);
                }
            } catch (error) {
                console.error('Error submitting board:', error);
                alert('게시글 작성 중 오류가 발생했습니다.');
            } finally {
                // 제출 버튼 다시 활성화
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
                document.getElementById('uploadProgress').style.display = 'none';
            }
        }
        
        // CSRF 토큰 가져오기
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        // CSRF 토큰 가져오기 함수
        function getCsrfToken() {
            const cookieValue = document.cookie
                .split('; ')
                .find(row => row.startsWith('csrftoken='))
                ?.split('=')[1];
            return cookieValue || '';
        }

            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.dataset.fileName = file.name;
            fileItem.dataset.fileSize = file.size;
            
            const fileIcon = getFileIcon(file.name);

        // 파일 아이콘 반환
        function getFileIcon(fileName) {
            const fileExt = fileName.split('.').pop()?.toLowerCase() || '';
            
            const iconMap = {
                // 이미지 파일
                'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'bmp': '🖼️', 'svg': '🖼️', 'webp': '🖼️',
                // 문서 파일
                'pdf': '📄', 'doc': '📝', 'docx': '📝', 'txt': '📄', 'rtf': '📝',
                // 스프레드시트
                'xls': '📊', 'xlsx': '📊', 'csv': '📊',
                // 프레젠테이션
                'ppt': '📋', 'pptx': '📋',
                // 압축 파일
                'zip': '📦', 'rar': '📦', '7z': '📦', 'tar': '📦', 'gz': '📦',
                // 오디오 파일
                'mp3': '🎵', 'wav': '🎵', 'flac': '🎵', 'aac': '🎵', 'ogg': '🎵',
                // 비디오 파일
                'mp4': '🎬', 'avi': '🎬', 'mov': '🎬', 'wmv': '🎬', 'flv': '🎬', 'mkv': '🎬',
                // 코드 파일
                'html': '🌐', 'css': '🎨', 'js': '⚙️', 'py': '🐍', 'java': '☕', 'cpp': '⚙️', 'c': '⚙️',
                // 기타
                'json': '📋', 'xml': '📋', 'sql': '🗄️', 'md': '📄'
            };
            
            return iconMap[fileExt] || '📄';
        }
        
        // 파일 크기 포맷팅
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // CSRF 토큰 가져오기
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        // CSRF 토큰 가져오기 함수
        function getCsrfToken() {
            const cookieValue = document.cookie
                .split('; ')
                .find(row => row.startsWith('csrftoken='))
                ?.split('=')[1];
            return cookieValue || '';
        }

        // CSRF 토큰 가져오기
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        // CSRF 토큰 가져오기 함수
        function getCsrfToken() {
            const cookieValue = document.cookie
                .split('; ')
                .find(row => row.startsWith('csrftoken='))
                ?.split('=')[1];
            return cookieValue || '';
        }

        // 공고 작성 제출
        async function submitAnnouncement() {
            // 유효성 검사 에러 초기화
            clearValidationErrors();
            
            const title = document.getElementById('announcement-title-input').value.trim();
            const content = document.getElementById('announcement-content-input').value.trim();
            const category = document.getElementById('announcement-category-input').value;
            
            let hasError = false;
            
            // 제목 유효성 검사
            if (!title) {
                showFieldError('announcement-title-input', 'title-error');
                hasError = true;
            }
            
            // 내용 유효성 검사
            if (!content) {
                showFieldError('announcement-content-input', 'content-error');
                hasError = true;
            }
            
            // 카테고리 유효성 검사 (필수)
            if (!category) {
                showFieldError('announcement-category-input', 'category-error');
                hasError = true;
            }
            
            // 에러가 있으면 제출 중단
            if (hasError) {
                return;
            }
            
            const submitBtn = document.querySelector('#writeAnnouncementModal .btn-submit');
            submitBtn.disabled = true;
            submitBtn.textContent = '작성 중...';
            
            try {
                // 파일 업로드
                const fileList = document.getElementById('announcementFileList');
                const fileItems = fileList.querySelectorAll('.file-item');
                const uploadedFiles = [];
                
                if (fileItems.length > 0) {
                    document.getElementById('announcementUploadProgress').style.display = 'block';
                    
                    for (let fileItem of fileItems) {
                        const fileName = fileItem.querySelector('.file-name').textContent;
                        const fileInput = document.getElementById('announcement-file-input');
                        const file = Array.from(fileInput.files).find(f => f.name === fileName);
                        
                        if (file) {
                            const formData = new FormData();
                            formData.append('file', file);
                            
                            const uploadResponse = await fetch('/sales/diary_board/announcement/upload-file/', {
                                method: 'POST',
                                body: formData
                            });
                            
                            const uploadData = await uploadResponse.json();
                            
                            if (uploadData.success) {
                                uploadedFiles.push(uploadData.file);
                            } else {
                                alert(`파일 업로드 실패: ${uploadData.message}`);
                                return;
                            }
                        }
                    }
                }
                
                // 공고 작성 (카테고리는 필수)
                const requestData = {
                    title: title,
                    content: content,
                    category: category,  // 카테고리는 항상 포함
                    files: uploadedFiles
                };
                
                console.log('선택된 카테고리 ID:', category);
                console.log('공고 작성 요청 데이터:', requestData);
                console.log('현재 선택된 카테고리 ID:', currentCategoryId);
                
                const response = await fetch('/sales/diary_board/announcement/create/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json; charset=utf-8',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify(requestData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('공고가 작성되었습니다.');
                    closeWriteAnnouncementModal();
                    
                    // 선택된 카테고리로 이동하고 탭 상태 업데이트
                    if (category && category.trim() !== '') {
                        // 카테고리 탭 상태 업데이트
                        updateCategoryTabActiveState(category);
                        // 해당 카테고리로 목록 로드
                        loadAnnouncements(1, '', category);
                    } else {
                        // 카테고리 미선택 시 전체 탭으로 이동
                        updateCategoryTabActiveState(null);
                        loadAnnouncements(1, '', null);
                    }
                } else {
                    alert('공고 작성 실패: ' + data.message);
                }
                
            } catch (error) {
                console.error('공고 작성 오류:', error);
                alert('공고 작성 중 오류가 발생했습니다.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '작성';
                document.getElementById('announcementUploadProgress').style.display = 'none';
            }
        }

        // 파일 미리보기 가능 여부 확인
        function canPreviewFile(file) {
            const fileName = file.original_name || file.original_filename || file.filename || '';
            const contentType = file.file_type || file.content_type || '';
            const fileExt = fileName.split('.').pop()?.toLowerCase() || '';
            
            // 이미지 파일
            if (contentType.startsWith('image/') || ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'svg', 'webp'].includes(fileExt)) {
                return true;
            }
            
            // PDF 파일
            if (contentType === 'application/pdf' || fileExt === 'pdf') {
                return true;
            }
            
            // 텍스트 파일
            if (contentType.includes('text/') || contentType.includes('application/json') || contentType.includes('application/xml') || 
                ['txt', 'json', 'xml', 'md', 'html', 'css', 'js', 'py', 'java', 'cpp', 'c', 'sql'].includes(fileExt)) {
                return true;
            }
            
            // 비디오 파일
            if (contentType.includes('video/') || ['mp4', 'avi', 'mov', 'wmv', 'flv', 'mkv'].includes(fileExt)) {
                return true;
            }
            
            // 오디오 파일
            if (contentType.includes('audio/') || ['mp3','wav','flac','aac','ogg','m4a'].includes(fileExt)) {
                return true;
            }
            
            // Office 문서 파일들
            if (['docx', 'doc', 'pptx', 'ppt', 'xlsx', 'xls'].includes(fileExt) || 
                contentType.includes('wordprocessingml') || 
                contentType.includes('presentationml') || 
                contentType.includes('spreadsheetml') ||
                contentType.includes('msword')) {
                return true;
            }
            
            return false;
        }

        // 로그아웃 함수
        function logout() {
            if (confirm('로그아웃하시겠습니까?')) {
                // 서버에 로그아웃 요청
                fetch('/sales/logout/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    }
                })
                .then(response => {
                    // 응답 타입 확인
                    const contentType = response.headers.get('content-type');
                    
                    if (contentType && contentType.includes('application/json')) {
                        // JSON 응답인 경우
                        return response.json().then(data => {
                            if (data.success) {
                                performLogoutCleanup();
                            } else {
                                alert('로그아웃 중 오류가 발생했습니다: ' + (data.error || ''));
                            }
                        });
                    } else {
                        // HTML 응답인 경우 (리다이렉트 등)
                        console.log('로그아웃 성공, HTML 응답 받음');
                        performLogoutCleanup();
                        return;
                    }
                })
                .catch(error => {
                    console.error('로그아웃 오류:', error);
                    // 오류가 발생해도 로그아웃 처리를 진행
                    performLogoutCleanup();
                });
            }
        }
        
        // 로그아웃 정리 작업
        function performLogoutCleanup() {
            // 브라우저 캐시 정리
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) {
                        caches.delete(name);
                    }
                });
            }
            
            // 세션 스토리지 정리
            sessionStorage.clear();
            
            // 로컬 스토리지 정리 (필요한 경우)
            localStorage.removeItem('user_preferences');
            
            // 로그인 페이지로 리다이렉트
            window.location.href = '/sales/login/';
        }
        
        // 파일 다운로드
        async function downloadFile(savedName, originalName) {
            console.log('다운로드 함수 호출:', { savedName, originalName });
            
            try {
                // 한글 파일명을 URL 인코딩하여 전달
                const encodedOriginalName = encodeURIComponent(originalName);
                
                // 원본 파일명을 URL 파라미터로 전달
                const params = new URLSearchParams({
                    original_name: originalName  // 원본 파일명 그대로 전달 (백엔드에서 인코딩)
                });
                
                // 서버에서 새로운 다운로드용 서명된 URL 요청
                const response = await fetch(`/sales/diary_board/announcement/download/${savedName}/?${params}`, {
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': getCsrfToken()
                    }
                });
                
                const data = await response.json();
                console.log('다운로드 URL 응답:', data);
                
                if (data.success && data.url) {
                    // 새로운 서명된 URL로 다운로드 (원본 파일명 사용)
                    const link = document.createElement('a');
                    link.href = data.url;
                    link.download = originalName; // 원본 파일명 사용
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    console.log('다운로드 시작:', originalName);
                } else {
                    alert('파일 다운로드 URL을 생성할 수 없습니다: ' + (data.message || '알 수 없는 오류'));
                }
            } catch (error) {
                console.error('파일 다운로드 오류:', error);
                alert('파일 다운로드 중 오류가 발생했습니다.');
            }
        }

            const originalName = button.getAttribute('data-original-name');
            console.log('버튼에서 파일 정보 읽기:', { savedName, originalName });

        // 기존 파일 제거
        function removeExistingFile(button) {

        // 편집 모달 파일 업로드 설정
        function setupEditAnnouncementFileUpload() {
            const fileInput = document.getElementById('edit-announcement-file-input');
            const uploadArea = document.querySelector('#editAnnouncementModal .file-upload-area');
            
            if (!fileInput || !uploadArea) return;
            
            fileInput.addEventListener('change', handleEditAnnouncementFileSelect);
            
            // 드래그 앤 드롭
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadArea.style.borderColor = '#667eea';
                uploadArea.style.backgroundColor = '#f0f4ff';
            });
            
            uploadArea.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadArea.style.borderColor = '#ddd';
                uploadArea.style.backgroundColor = 'transparent';
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadArea.style.borderColor = '#ddd';
                uploadArea.style.backgroundColor = 'transparent';
                
                const files = e.dataTransfer.files;
                console.log('드래그 앤 드롭으로 받은 파일:', files);
                handleEditAnnouncementFiles(files);
            });
        }
        
        // 편집 모달 파일 선택 처리
        function handleEditAnnouncementFileSelect(event) {
            const files = event.target.files;
            handleEditAnnouncementFiles(files);
        }
        
        // 편집 모달 파일 처리
        function handleEditAnnouncementFiles(files) {
            for (let file of files) {
                // 파일 크기 제한 (10MB)
                if (file.size > 10 * 1024 * 1024) {
                    alert('파일 크기가 너무 큽니다. (최대 10MB)');
                    continue;
                }
                
                const fileItem = createEditAnnouncementFileItem(file);
                document.getElementById('editAnnouncementFileList').appendChild(fileItem);
            }
        }
        
        // 편집 모달 파일 아이템 생성
        function createEditAnnouncementFileItem(file) {
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item new-file';
            
            const fileIcon = getFileIcon(file.name);
            const fileSize = formatFileSize(file.size);
            
            fileItem.innerHTML = `
                <div class="file-info">
                    <div class="file-icon">${fileIcon}</div>
                    <div class="file-name">${escapeHtml(file.name)}</div>
                    <div class="file-size">${fileSize}</div>
                </div>
                <button class="file-remove" onclick="removeEditAnnouncementFile(this)">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            return fileItem;
        }
        
        // 편집 모달 파일 제거
        function removeEditAnnouncementFile(button) {
            button.parentElement.remove();
        }

                    console.error('편집 모달 카테고리 옵션 로드 실패:', data.message);

        // 게시글 수정
        async function updateAnnouncement() {
            if (!window.currentEditingAnnouncementId) {
                alert('편집할 게시글을 찾을 수 없습니다.');
                return;
            }
            
            // 유효성 검사
            clearEditValidationErrors();
            
            const title = document.getElementById('edit-announcement-title').value.trim();
            const content = document.getElementById('edit-announcement-content').value.trim();
            const category = document.getElementById('edit-announcement-category').value;
            
            let hasError = false;
            
            if (!title) {
                showFieldError('edit-announcement-title', 'edit-title-error');
                hasError = true;
            }
            
            if (!content) {
                showFieldError('edit-announcement-content', 'edit-content-error');
                hasError = true;
            }
            
            // 카테고리 유효성 검사 (필수)
            if (!category) {
                showFieldError('edit-announcement-category', 'edit-category-error');
                hasError = true;
            }
            
            if (hasError) {
                return;
            }
            
            const submitBtn = document.querySelector('#editAnnouncementModal .btn-submit');
            submitBtn.disabled = true;
            submitBtn.textContent = '수정 중...';
            
            try {
                // 새로 업로드된 파일 처리
                const fileList = document.getElementById('editAnnouncementFileList');
                const newFileItems = fileList.querySelectorAll('.new-file');
                const uploadedFiles = [];
                
                if (newFileItems.length > 0) {
                    document.getElementById('editAnnouncementUploadProgress').style.display = 'block';
                    
                    for (let fileItem of newFileItems) {
                        const fileName = fileItem.querySelector('.file-name').textContent;
                        const fileInput = document.getElementById('edit-announcement-file-input');
                        const file = Array.from(fileInput.files).find(f => f.name === fileName);
                        
                        if (file) {
                            const formData = new FormData();
                            formData.append('file', file);
                            
                            const uploadResponse = await fetch('/sales/diary_board/announcement/upload-file/', {
                                method: 'POST',
                                body: formData
                            });
                            
                            const uploadData = await uploadResponse.json();
                            
                            if (uploadData.success) {
                                uploadedFiles.push(uploadData.file);
                            } else {
                                alert(`파일 업로드 실패: ${uploadData.message}`);
                                return;
                            }
                        }
                    }
                }
                
                // 기존 파일 목록 (제거되지 않은 파일들)
                const existingFileItems = fileList.querySelectorAll('.existing-file');
                const existingFiles = [];
                existingFileItems.forEach(fileItem => {
                    const savedName = fileItem.getAttribute('data-file-id');
                    const originalName = fileItem.getAttribute('data-original-name');
                    const fileSize = fileItem.getAttribute('data-file-size');
                    
                    if (savedName && originalName) {
                        // 기존 파일 정보를 유지
                        existingFiles.push({
                            saved_name: savedName,
                            original_name: originalName,
                            file_size: parseInt(fileSize) || 0
                        });
                    }
                });
                
                console.log('기존 파일:', existingFiles);
                console.log('새로 업로드된 파일:', uploadedFiles);
                
                // 모든 파일 합치기
                const allFiles = [...existingFiles, ...uploadedFiles];
                console.log('최종 파일 목록:', allFiles);
                
                // 공고 수정 (카테고리는 필수)
                const requestData = {
                    title: title,
                    content: content,
                    category: category,  // 카테고리는 항상 포함
                    files: allFiles
                };
                
                // 카테고리가 선택된 경우에만 추가
                if (category && category.trim() !== '') {
                    requestData.category = category;
                    console.log('편집 시 선택된 카테고리 ID:', category);
                } else {
                    console.log('편집 시 카테고리 미선택');
                }
                
                console.log('공고 수정 요청 데이터:', requestData);
                console.log('현재 선택된 카테고리 ID:', currentCategoryId);
                
                const response = await fetch(`/sales/diary_board/announcement/${window.currentEditingAnnouncementId}/update/`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json; charset=utf-8',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify(requestData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('게시글이 수정되었습니다.');
                    closeEditAnnouncementModal();
                    
                    // 선택된 카테고리로 이동하고 탭 상태 업데이트
                    if (category && category.trim() !== '') {
                        // 카테고리 탭 상태 업데이트
                        updateCategoryTabActiveState(category);
                        // 해당 카테고리로 목록 로드
                        loadAnnouncements(1, '', category);
                    } else {
                        // 카테고리 미선택 시 전체 탭으로 이동
                        updateCategoryTabActiveState(null);
                        loadAnnouncements(1, '', null);
                    }
                } else {
                    alert('게시글 수정 실패: ' + data.message);
                }
                
            } catch (error) {
                console.error('게시글 수정 오류:', error);
                alert('게시글 수정 중 오류가 발생했습니다.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '수정';
                document.getElementById('editAnnouncementUploadProgress').style.display = 'none';
            }
        }

        // 카테고리 탭 active 상태 업데이트
        function updateCategoryTabActiveState(categoryId) {
            console.log('카테고리 탭 상태 업데이트:', categoryId);
            
            // 현재 선택된 카테고리 ID 업데이트
            currentCategoryId = categoryId;
            currentCategoryName = categoryId ? '카테고리' : '전체';
            
            // 모든 카테고리 탭에서 active 클래스 제거
            const tabs = document.querySelectorAll('#announcement-category-tabs .category-tab');
            tabs.forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 해당하는 카테고리 탭에 active 클래스 추가
            if (categoryId) {
                // 특정 카테고리 탭 찾기
                const targetTab = Array.from(tabs).find(tab => {
                    const tabCategoryId = tab.onclick.toString().match(/switchAnnouncementCategory\('(\d+)'/)?.[1];
                    return tabCategoryId && parseInt(tabCategoryId) === parseInt(categoryId);
                });
                
                if (targetTab) {
                    targetTab.classList.add('active');
                    currentCategoryName = targetTab.textContent.trim();
                    console.log('카테고리 탭 활성화:', currentCategoryName);
                }
            } else {
                // 전체 탭 활성화
                const allTab = Array.from(tabs).find(tab => tab.textContent.trim() === '전체');
                if (allTab) {
                    allTab.classList.add('active');
                    currentCategoryName = '전체';
                    console.log('전체 탭 활성화');
                }
            }
            
            console.log('현재 카테고리 상태:', { id: currentCategoryId, name: currentCategoryName });
        }
    </script>

<!-- 모듈화된 JavaScript 파일들 로드 -->
{% load static %}
<script src="{% static 'diary/utility_functions.js' %}"></script>
<script src="{% static 'diary/dropdown_management.js' %}"></script>
<script src="{% static 'diary/modal_management.js' %}"></script>
<script src="{% static 'diary/table_management.js' %}"></script>
<script src="{% static 'diary/kanban_management.js' %}"></script>
<script src="{% static 'diary/audio_management.js' %}"></script>

<script>
// 페이지 초기화 스크립트
document.addEventListener('DOMContentLoaded', function() {
    console.log('모듈화된 스크립트 로딩 완료');
    
    // 테이블 관련 초기화
    if (typeof initializeTableData === 'function') {
        initializeTableData();
    }
    
    // 테이블 셀 이벤트 바인딩
    if (typeof bindTableCellEvents === 'function') {
        bindTableCellEvents();
    }
    
    // 칸반보드 초기화
    if (typeof bindKanbanSortable === 'function') {
        bindKanbanSortable();
    }
    
    // URL 파라미터 확인 및 칸반보드 업데이트
    const urlParams = new URLSearchParams(window.location.search);
    const kanbanAttr = urlParams.get('kanban');
    if (kanbanAttr && typeof updateKanbanBoard === 'function') {
        updateKanbanBoard(kanbanAttr);
    }
    
    // 칸반 속성 선택 변경 이벤트
    const kanbanSelect = document.getElementById('kanbanAttributeSelect');
    if (kanbanSelect && typeof changeKanbanAttribute === 'function') {
        kanbanSelect.addEventListener('change', function() {
            changeKanbanAttribute(this);
        });
    }
    
    // 칸반 새로고침 버튼
    const refreshKanbanBtn = document.getElementById('refreshKanbanBtn');
    if (refreshKanbanBtn && typeof refreshKanban === 'function') {
        refreshKanbanBtn.addEventListener('click', function() {
            refreshKanban();
        });
    }
    
    // 새 행 추가 버튼
    const addRowBtn = document.getElementById('addRowBtn');
    if (addRowBtn) {
        addRowBtn.onclick = function() {
            const tr = document.createElement('tr');
            const tbody = document.getElementById('entryTbody');
            
            // 새 ID 생성 (임시)
            const newId = 'new_' + Date.now();
            tr.setAttribute('data-id', newId);
            
            // 드래그 핸들 셀 추가
            const dragCell = document.createElement('td');
            dragCell.className = 'drag-cell';
            dragCell.innerHTML = '<span class="drag-handle">⋮⋮⋮</span>';
            tr.appendChild(dragCell);
            
            // 각 속성에 대한 셀 생성
            const fields = window.ATTR_FIELDS || [];
            fields.forEach(function(field) {
                const td = document.createElement('td');
                td.setAttribute('data-field', field.name);
                td.setAttribute('data-type', field.attributeType_name);
                
                if (field.assential) {
                    td.classList.add('essential-column');
                }
                
                if (field.name === '이름') {
                    td.innerHTML = '<div class="name-text"></div><div class="more-btn-wrapper"><div class="more-btn" style="cursor:pointer;">⋯</div></div>';
                } else if (field.attributeType_name === 'file') {
                    td.innerHTML = '<span style="color: #6c757d; font-size: 12px;">파일 없음</span>';
                }
                
                tr.appendChild(td);
            });
            
            // 속성 추가 셀
            const addAttrCell = document.createElement('td');
            addAttrCell.className = 'add-attribute-cell';
            addAttrCell.style.background = '#f8f9fa';
            tr.appendChild(addAttrCell);
            
            tbody.appendChild(tr);
            
            // 새 행 이벤트 바인딩
            if (typeof bindNewRowEvents === 'function') {
                bindNewRowEvents(tr);
            }
        };
    }
    
    // 음성 파일 관리 초기화
    if (typeof initializeAudioFileSorting === 'function') {
        initializeAudioFileSorting();
    }
    
    console.log('페이지 초기화 완료');
});

// 전역 함수들 (기존 HTML에서 사용되는 함수들)
window.deleteAttribute = function(attrName) {
    if (!confirm(`"${attrName}" 속성을 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없으며, 해당 속성과 관련된 모든 데이터가 삭제됩니다.`)) {
        return;
    }
    
    fetch('/diary/delete_attribute/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: `name=${encodeURIComponent(attrName)}`
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert(data.message);
            location.reload();
        } else {
            alert('오류: ' + data.error);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('속성 삭제 중 오류가 발생했습니다.');
    });
};

// 테이블 행 업데이트 함수
window.updateTableRow = function(entryData) {
    const tr = document.querySelector(`tr[data-id="${entryData.id}"]`);
    if (!tr) return;
    
    const fields = window.ATTR_FIELDS || [];
    fields.forEach(field => {
        const td = tr.querySelector(`td[data-field="${field.name}"]`);
        if (!td) return;
        
        const value = entryData.values && entryData.values[field.name] ? entryData.values[field.name] : {};
        
        if (field.name === '이름') {
            const nameText = td.querySelector('.name-text');
            if (nameText) {
                nameText.textContent = value.label || '';
            }
        } else if (field.attributeType_name === 'dropdown') {
            td.textContent = value.label || '';
            if (value.color) {
                td.style.background = hexToRgba(value.color, 0.18);
            }
        } else if (field.attributeType_name === 'file') {
            if (value.label) {
                td.innerHTML = `<span style="color: #007bff; font-size: 12px;">📎 ${value.label}</span>`;
            } else {
                td.innerHTML = '<span style="color: #6c757d; font-size: 12px;">파일 없음</span>';
            }
        } else if (field.name === '기대출') {
            if (value.label) {
                const debtValues = value.label.split(',');
                let html = '';
                debtValues.forEach(debt => {
                    if (debt.trim()) {
                        html += `<span class="debt-tag">${debt.trim()}</span>`;
                    }
                });
                td.innerHTML = html;
            } else {
                td.innerHTML = '';
            }
        } else {
            td.textContent = value.label || '';
        }
    });
};

// 페이지 로딩 시 전역 변수 설정
window.kanbanAttribute = window.SELECTED_KANBAN_ATTR;

console.log('모듈화된 스크립트 파일 로드 완료');
</script>
